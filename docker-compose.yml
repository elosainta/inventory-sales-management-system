# Container logs are capped, because nothing else caps them.
#
# Docker's json-file driver keeps writing until the disk is full. `schedule:work`
# alone prints roughly 1,440 lines a day ("No scheduled commands are ready to
# run"), and the file is only reset when a container is recreated — so between
# deploys it grows without limit. 10 MB x 3 files bounds each service at 30 MB
# and still leaves plenty of history to debug from.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DB_HOST: db
      DB_PORT: 3306
      # UseDemoDatabase swaps the DEFAULT connection to mariadb_demo per-request
      # for demo logins. Session, cache and queue must stay on live regardless,
      # or a demo request writes its session into the sandbox. These were only
      # ever documented as set, never actually set — all three read NULL on
      # production. Pinned here rather than in the server .env precisely because
      # `environment:` overrides `env_file:`, so it cannot be lost by editing
      # that file or forgetting a line when provisioning a new box.
      SESSION_CONNECTION: mariadb
      DB_CACHE_CONNECTION: mariadb
      DB_CACHE_LOCK_CONNECTION: mariadb
      DB_QUEUE_CONNECTION: mariadb
    volumes:
      - storage_data:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"

  db:
    image: mariadb:12
    restart: unless-stopped
    logging: *default-logging
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_MYSQL_LOCALHOST_USER: 1
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  storage_data:
  logs:
